<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎧 DJ Song Requests</title>
<style>
body { background:#121212; color:white; font-family:Arial,sans-serif; text-align:center; margin:0; padding:0; }
.container { max-width:800px; margin:auto; padding:20px; }
input { padding:12px; width:70%; border:none; border-radius:8px; }
button { padding:12px; background:#1DB954; border:none; color:white; border-radius:8px; margin:5px; cursor:pointer; }
button:hover { background:#18a64c; }
.song { background:#1e1e1e; margin:10px auto; padding:10px; border-radius:8px; }
.admin { border:2px solid orange; }
iframe { border-radius:12px; margin-top:15px; }
</style>
</head>
<body>
<div class="container">
<h1>🎧 DJ Song Requests</h1>

<h2>Current Playlist</h2>
<iframe src="https://open.spotify.com/embed/playlist/0ODwqMSSEUeT0nFWQVwA3A" width="100%" height="380" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>

<br><br>
<input id="search" placeholder="Search songs or artists">
<button onclick="search()">Search</button>

<div id="results"></div>

<h2>Requested Songs</h2>
<div id="requests"></div>

<script>
let requests = [];

const WORKER_URL = "https://spotify-backend-yourname.workers.dev"; // Replace with your worker URL
const ADMIN_PASSWORD = "djparty"; // Change if you want

async function search(){
  let q = document.getElementById("search").value;
  if(!q) return;

  let res = await fetch(`${WORKER_URL}/?q=${encodeURIComponent(q)}`);
  let data = await res.json();

  let html = "";
  data.forEach(track => {
    html += `<div class="song"><b>${track.name}</b> - ${track.artists[0].name}<br>
             <button onclick="requestSong('${track.uri}','${track.name}','${track.artists[0].name}')">Request</button></div>`;
  });
  document.getElementById("results").innerHTML = html;
}

function requestSong(uri,name,artist){
  requests.push({uri,name,artist});
  render();
}

async function approve(i){
  let pass = prompt("Admin password");
  if(pass !== ADMIN_PASSWORD){ alert("Wrong password"); return; }

  let song = requests[i];
  await fetch(`${WORKER_URL}/?add=${encodeURIComponent(song.uri)}`);
  requests.splice(i,1);
  render();
}

function render(){
  let html = "";
  requests.forEach((s,i)=>{
    html += `<div class="song admin"><b>${s.name}</b> - ${s.artist}<br>
             <button onclick="approve(${i})">Approve</button></div>`;
  });
  document.getElementById("requests").innerHTML = html;
}
</script>
</div>
</body>
</html>
