<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎧 DJ Song Requests</title>
<style>
body { margin:0; padding:0; font-family:Arial,sans-serif; background:#121212; color:white; }
.container { max-width:600px; margin:auto; padding:20px; }
h1,h2 { text-align:center; }
input { padding:12px; width:70%; border-radius:8px; border:none; margin:5px 0; }
button { padding:12px; margin:5px; border:none; border-radius:8px; background:#1DB954; color:white; cursor:pointer; }
button:hover { background:#18a64c; }
.song { background:#1e1e1e; margin:10px 0; padding:10px; border-radius:8px; display:flex; justify-content:space-between; flex-wrap:wrap; }
.admin { border:2px solid orange; }
.suggestion { cursor:pointer; padding:5px; border-radius:6px; }
.suggestion:hover { background:#333; }
</style>
</head>
<body>
<div class="container">
<h1>🎧 DJ Song Requests</h1>
<input id="songInput" placeholder="Type song or artist" autocomplete="off">
<div id="suggestions"></div>

<h2>Requested Songs</h2>
<div id="requests"></div>

<button onclick="downloadRequests()">Download Queue as TXT</button>
</div>

<script>
// --- Preloaded song/artist list for suggestions ---
const songDB = [
  "Blinding Lights - The Weeknd",
  "Save Your Tears - The Weeknd",
  "Levitating - Dua Lipa",
  "Peaches - Justin Bieber",
  "Stay - The Kid LAROI",
  "Bad Habits - Ed Sheeran",
  "Shivers - Ed Sheeran",
  "Heat Waves - Glass Animals",
  "Industry Baby - Lil Nas X",
  "Montero - Lil Nas X",
  "As It Was - Harry Styles",
  "Watermelon Sugar - Harry Styles",
  "Anti-Hero - Taylor Swift",
  "Flowers - Miley Cyrus",
  "Unholy - Sam Smith",
  "Calm Down - Rema",
  "Ghost - Justin Bieber",
  "Attention - Charlie Puth"
  // Add as many as you want
];

let requests = JSON.parse(localStorage.getItem("requests")) || [];

// --- Render requests ---
function renderRequests() {
  let unique = [...new Set(requests)];
  let html = "";
  unique.forEach((r,i)=>{
    html += `<div class="song admin">${r} <button onclick="removeRequest(${i})">Remove</button></div>`;
  });
  document.getElementById("requests").innerHTML = html;
  requests = unique;
  localStorage.setItem("requests", JSON.stringify(requests));
}

// --- Remove request ---
function removeRequest(index) {
  requests.splice(index,1);
  renderRequests();
}

// --- Download requests ---
function downloadRequests() {
  let blob = new Blob([requests.join("\n")], {type:"text/plain"});
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url; a.download="song_requests.txt";
  a.click();
  URL.revokeObjectURL(url);
}

// --- Suggest songs as user types ---
document.getElementById("songInput").addEventListener("input", function(){
  let query = this.value.toLowerCase();
  if(!query){ document.getElementById("suggestions").innerHTML=""; return; }
  let matches = songDB.filter(s => s.toLowerCase().includes(query)).slice(0,5);
  let html = "";
  matches.forEach(m => {
    html += `<div class="suggestion" onclick="requestSong('${m}')">${m}</div>`;
  });
  document.getElementById("suggestions").innerHTML = html;
});

// --- Request a song ---
function requestSong(name) {
  requests.push(name);
  renderRequests();
  document.getElementById("suggestions").innerHTML = "";
  document.getElementById("songInput").value = "";
}

// --- Initial render ---
renderRequests();
</script>
</body>
</html>
