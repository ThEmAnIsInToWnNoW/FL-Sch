<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDPOINTMC</title>
    <link rel="icon" href="https://midpointmc.net/Midpoint.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            overflow: hidden;
            position: relative;
            min-height: 100vh;
            text-align: center;
            background: #0a1f0a;
            image-rendering: pixelated;
        }
        #panorama {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2; image-rendering: pixelated;
        }
        .vignette {
            position: fixed; inset: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 40%, transparent 20%, rgba(0,0,0,0.65) 100%);
            z-index: -1;
        }
        .header {
            position: absolute;
            top: -2%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: min(67.5%, 750px);
            max-width: 100%;
        }
        .midpoint-title {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
            filter: drop-shadow(0 6px 0 #000) drop-shadow(0 -6px 0 #000) drop-shadow(6px 0 0 #000) drop-shadow(-6px 0 0 #000);
        }
        .splash {
            position: fixed;
            transform: rotate(-12deg);
            transform-origin: top left;
            color: #ffff55;
            font-size: clamp(9px, 1.1%, 15px);
            text-shadow: 2px 2px 0 #aa6600, 1px 1px 0 #000;
            pointer-events: none;
            white-space: nowrap;
            z-index: 9998;
        }
        .menu {
            position: absolute;
            top: 68%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: block; width: 310px; height: 40px;
            text-decoration: none; image-rendering: pixelated;
            cursor: pointer; transition: transform 0.08s, filter 0.08s;
            padding: 0; border: none; background: none; font-size: 0; line-height: 0;
        }
        .btn img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn:active { transform: translateY(2px); filter: brightness(0.9); }
        .group { display: flex; gap: 10px; justify-content: center; }
        .group .btn { width: 150px; }
        #status-box {
            position: fixed; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.75); padding: 14px 18px;
            border: 5px solid #333; box-shadow: 6px 6px 0 #111;
            font-size: 1rem; z-index: 20; min-width: 220px; max-width: 280px; text-align: left;
        }
        #status { color: #44ff44; font-weight: bold; display: block; margin-bottom: 8px; }
        #players { margin: 0; padding: 0; list-style: none; font-size: 0.9rem; }
        #players li { margin: 2px 0; word-break: break-all; }
        #loading-screen {
            position: fixed; inset: 0; background: #0a1f0a; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #55ff55; font-family: 'Press Start 2P', cursive; font-size: 1.4rem;
            text-shadow: 3px 3px 0 #000; transition: opacity 0.6s ease-out; pointer-events: all;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px; height: 60px;
            border: 6px solid #55ff55; border-top: 6px solid transparent;
            border-radius: 50%; animation: spin 1.2s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-text { margin-top: 12px; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Loading world...</div>
    </div>
    <div id="panorama"></div>
    <div class="vignette"></div>
    <div class="header">
        <img src="minecraft_title.png" alt="MIDPOINT" class="midpoint-title">
    </div>
    <div class="splash" id="splash">More addictive than lemonade!</div>
    <div class="menu">
        <a href="https://midpointmc.net/wiki/index.html" class="btn"><img src="wiki.png" alt="Wiki"></a>
        <a href="https://midpointmc.net/gallery/index.html" class="btn"><img src="Gallery.png" alt="Gallery"></a>
        <a href="https://midpointmc.net/Socials.html" class="btn"><img src="socials.png" alt="Socials"></a>
        <a href="https://midpointmc.net/info.html" class="btn"><img src="info.png" alt="Info"></a>
        <div class="group">
            <a href="https://map.midpointmc.net/" class="btn"><img src="map.png" alt="Map"></a>
            <a href="https://midpointmc.net/stats/" class="btn"><img src="stats.png" alt="Stats"></a>
        </div>
    </div>
    <div id="status-box">
        <span id="status">Checking server...</span>
        <ul id="players"></ul>
    </div>
<script>
    const loadingScreen = document.getElementById('loading-screen');
    function hideLoading() {
        loadingScreen.classList.add('hidden');
        setTimeout(() => { loadingScreen.remove(); }, 700);
    }
    let viewer;
    try {
        viewer = pannellum.viewer('panorama', {
            "type": "equirectangular", "panorama": "output.jpg", "autoLoad": true,
            "autoRotate": -4.5, "showControls": false, "showFullscreenCtrl": false,
            "showZoomCtrl": false, "hfov": 250, "pitch": -5, "yaw": 35
        });
        viewer.on('load', hideLoading);
        setTimeout(hideLoading, 12000);
    } catch (e) {
        document.body.style.background = "url('output.jpg') center/cover no-repeat";
        setTimeout(hideLoading, 1500);
    }
    const splashes = [
        "More addictive than lemonade!", "MIDPOINTMC AWAITS!",
        "PUNCH A TREE TO START!", "NEVER DIG STRAIGHT DOWN!", "BUILD EPIC OR GO HOME"
    ];
    document.getElementById('splash').textContent = splashes[Math.floor(Math.random() * splashes.length)];

    // Position splash over the bottom-right corner of the title image
    function positionSplash() {
        const title = document.querySelector('.midpoint-title');
        const splash = document.getElementById('splash');
        const rect = title.getBoundingClientRect();
        const splashRect = splash.getBoundingClientRect();
        // Align splash's right edge to title's right edge, shifted up to overlap
        splash.style.left = (rect.right - splashRect.width) + 'px';
        splash.style.top  = (rect.bottom - splashRect.height - 30) + 'px';
    }
    function waitAndPosition() {
        requestAnimationFrame(() => requestAnimationFrame(positionSplash));
    }
    const titleImg = document.querySelector('.midpoint-title');
    if (titleImg.complete && titleImg.naturalWidth > 0) {
        waitAndPosition();
    } else {
        titleImg.addEventListener('load', waitAndPosition);
    }
    window.addEventListener('resize', positionSplash);
    function updateStatus() {
        fetch('https://api.mcsrvstat.us/2/midpointmc.net')
            .then(res => res.json())
            .then(data => {
                const status = document.getElementById('status');
                const playersList = document.getElementById('players');
                playersList.innerHTML = '';
                if (data.online) {
                    status.textContent = 'Server is ONLINE!'; status.style.color = '#44ff44';
                    let names = [];
                    if (data.players && data.players.list) names = names.concat(data.players.list);
                    if (data.info && data.info.raw) names = names.concat(data.info.raw);
                    names = [...new Set(names)];
                    if (names.length > 0) {
                        names.forEach(n => {
                            const li = document.createElement('li'); li.textContent = n;
                            if (n.startsWith(".")) { li.style.color = "#55ffff"; li.style.fontStyle = "italic"; }
                            playersList.appendChild(li);
                        });
                    } else { playersList.innerHTML = '<li>No players online</li>'; }
                } else {
                    status.textContent = 'Server is OFFLINE'; status.style.color = '#ff4444';
                    playersList.innerHTML = '<li>No players online</li>';
                }
            })
            .catch(() => {
                document.getElementById('status').textContent = 'Status unavailable';
                document.getElementById('status').style.color = '#ffaa00';
            });
    }
    updateStatus();
    setInterval(updateStatus, 30000);
</script>
</body>
</html>
