<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MIDPOINTMC</title>
<link rel="icon" href="https://midpointmc.net/Midpoint.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Press Start 2P', cursive;
        color: #fff;
        background: #0a1f0a;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    #panorama {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -2;
    }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 40%, transparent 20%, rgba(0,0,0,0.65) 100%);
        z-index: -1;
    }

    /* ── LAYOUT: everything scales with vw ── */
    .page-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 2vh;
        z-index: 10;
        width: 100%;
        padding: 1vh 0 2vh 0;
    }

    .header {
        position: relative;
        width: 45vw;
        min-width: 200px;
        max-width: 750px;
    }
    .midpoint-title {
        width: 100%;
        height: auto;
        display: block;
        image-rendering: pixelated;
        filter: drop-shadow(0 4px 0 #000) drop-shadow(0 -4px 0 #000) drop-shadow(4px 0 0 #000) drop-shadow(-4px 0 0 #000);
    }

    .splash {
        position: fixed;
        transform: rotate(-12deg);
        transform-origin: top left;
        color: #ffff55;
        font-size: 1.1vw;
        text-shadow: 2px 2px 0 #aa6600, 1px 1px 0 #000;
        pointer-events: none;
        white-space: nowrap;
        z-index: 9998;
    }

    .menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1vh;
        width: 100%;
    }
    .btn {
        display: block;
        width: 22vw;
        min-width: 160px;
        max-width: 340px;
        height: 3vw;
        min-height: 28px;
        max-height: 50px;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.08s, filter 0.08s;
        padding: 0; border: none; background: none;
    }
    .btn img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
    .btn:active { transform: translateY(2px); filter: brightness(0.9); }
    .group { display: flex; gap: 1vw; justify-content: center; }
    .group .btn {
        width: 10.5vw;
        min-width: 76px;
        max-width: 164px;
        height: 3vw;
        min-height: 28px;
        max-height: 50px;
    }

    #status-box {
        position: fixed; bottom: 1.5vh; left: 1.5vw;
        background: rgba(0,0,0,0.75);
        padding: 1vh 1vw;
        border: 2px solid #333;
        box-shadow: 4px 4px 0 #111;
        font-size: 0.8vw;
        z-index: 20;
        min-width: 12vw;
        max-width: 20vw;
        text-align: left;
    }
    #status { color: #44ff44; font-weight: bold; display: block; margin-bottom: 0.5vh; }
    #players { margin: 0; padding: 0; list-style: none; font-size: 0.7vw; }
    #players li { margin: 0.3vh 0; word-break: break-all; }

    #loading-screen {
        position: fixed; inset: 0; background: #0a1f0a; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #55ff55; font-family: 'Press Start 2P', cursive;
        font-size: 2vw; text-shadow: 2px 2px 0 #000;
        transition: opacity 0.6s ease-out;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
        width: 6vw; height: 6vw; max-width: 60px; max-height: 60px;
        border: 0.6vw solid #55ff55; border-top-color: transparent;
        border-radius: 50%; animation: spin 1.2s linear infinite; margin-bottom: 2vh;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* phones only - actual small screens */
    @media (max-width: 500px) {
        .header { width: 88vw; min-width: unset; max-width: unset; }
        .btn { width: 80vw; min-width: unset; max-width: unset; height: 12vw; min-height: unset; max-height: unset; }
        .group .btn { width: 38vw; min-width: unset; max-width: unset; height: 12vw; }
        .splash { font-size: 3vw; }
        #status-box { font-size: 3vw; min-width: 48vw; max-width: 65vw; padding: 2vw 3vw; }
        #players { font-size: 2.6vw; }
    }

    /* 4K */
    @media (min-width: 2560px) {
        .header { width: 36vw; max-width: 1100px; }
        .btn { width: 18vw; max-width: 650px; height: 2.6vw; max-height: 100px; }
        .group .btn { width: 8.6vw; max-width: 310px; height: 2.6vw; max-height: 100px; }
        .splash { font-size: 0.85vw; }
        #status-box { font-size: 0.75vw; min-width: 13vw; max-width: 18vw; }
        #players { font-size: 0.65vw; }
    }
</style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">Loading world...</div>
</div>

<div id="panorama"></div>
<div class="vignette"></div>

<div class="page-wrapper">
    <div class="header">
        <img src="minecraft_title.png?v=2" alt="MIDPOINT" class="midpoint-title">
    </div>
    <div class="menu">
        <a href="https://midpointmc.net/wiki/index.html" class="btn"><img src="wiki.png" alt="Wiki"></a>
        <a href="https://midpointmc.net/gallery/index.html" class="btn"><img src="Gallery.png" alt="Gallery"></a>
        <a href="https://midpointmc.net/Socials.html" class="btn"><img src="socials.png" alt="Socials"></a>
        <a href="https://midpointmc.net/info.html" class="btn"><img src="info.png" alt="Info"></a>
        <div class="group">
            <a href="https://map.midpointmc.net/" class="btn"><img src="map.png" alt="Map"></a>
            <a href="https://midpointmc.net/stats/" class="btn"><img src="stats.png" alt="Stats"></a>
        </div>
    </div>
</div>

<div class="splash" id="splash">More addictive than lemonade!</div>

<div id="status-box">
    <span id="status">Checking server...</span>
    <ul id="players"></ul>
</div>

<script>
const loadingScreen = document.getElementById('loading-screen');
let loadingHidden = false;
function hideLoading() {
    if (loadingHidden) return;
    loadingHidden = true;
    loadingScreen.classList.add('hidden');
    setTimeout(() => { if (loadingScreen.parentNode) loadingScreen.remove(); }, 700);
}

function hasWebGL() {
    try {
        const c = document.createElement('canvas');
        return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
    } catch(e) { return false; }
}

const hardTimeout = setTimeout(hideLoading, 3000);

if (hasWebGL()) {
    try {
        const isMobile = window.innerWidth <= 500;
        window.viewer = pannellum.viewer('panorama', {
            type: "equirectangular",
            panorama: isMobile ? 'output_mobile.jpg' : 'output.jpg',
            autoLoad: true, autoRotate: -4.5,
            showControls: false, showFullscreenCtrl: false, showZoomCtrl: false,
            hfov: window.innerWidth < 600 ? 180 : window.innerWidth < 900 ? 220 : 250,
            pitch: -5, yaw: 35
        });
        window.viewer.on('load', () => { clearTimeout(hardTimeout); hideLoading(); });
        window.viewer.on('error', () => { clearTimeout(hardTimeout); hideLoading(); });
    } catch(e) {
        document.getElementById('panorama').style.display = 'none';
        document.body.style.background = "url('output.jpg') center/cover no-repeat fixed";
        clearTimeout(hardTimeout); hideLoading();
    }
} else {
    document.getElementById('panorama').style.display = 'none';
    document.body.style.background = "url('output.jpg') center/cover no-repeat fixed";
    clearTimeout(hardTimeout); hideLoading();
}

// Splash
const splashes = ["More addictive than lemonade!", "MIDPOINTMC AWAITS!", "PUNCH A TREE TO START!", "NEVER DIG STRAIGHT DOWN!", "BUILD EPIC OR GO HOME"];
document.getElementById('splash').textContent = splashes[Math.floor(Math.random() * splashes.length)];

function positionSplash() {
    const title = document.querySelector('.midpoint-title');
    const splash = document.getElementById('splash');
    const rect = title.getBoundingClientRect();
    splash.style.left = '-9999px'; splash.style.top = '-9999px';
    const sw = splash.offsetWidth; const sh = splash.offsetHeight;
    splash.style.left = (rect.right - sw + 5) + 'px';
    splash.style.top  = (rect.bottom - sh - (rect.height * 0.25)) + 'px';
}
function waitAndPosition() { requestAnimationFrame(() => requestAnimationFrame(positionSplash)); }
const titleImg = document.querySelector('.midpoint-title');
if (titleImg.complete && titleImg.naturalWidth > 0) waitAndPosition();
else titleImg.addEventListener('load', waitAndPosition);
window.addEventListener('resize', positionSplash);

// Server status
function updateStatus() {
    fetch('https://api.mcsrvstat.us/3/midpointmc.net')
        .then(res => res.json())
        .then(data => {
            const status = document.getElementById('status');
            const playersList = document.getElementById('players');
            playersList.innerHTML = '';
            if (data.online) {
                status.textContent = 'Server is ONLINE!'; status.style.color = '#44ff44';
                let names = [];
                if (data.players && data.players.list)
                    data.players.list.forEach(p => names.push(typeof p === 'object' ? p.name : p));
                if (data.info && data.info.clean)
                    data.info.clean.forEach(l => { if (l.trim()) names.push(l.trim()); });
                else if (data.info && data.info.raw)
                    data.info.raw.forEach(l => { if (l.trim()) names.push(l.trim()); });
                names = [...new Set(names)];
                if (names.length > 0) names.forEach(n => {
                    const li = document.createElement('li'); li.textContent = n;
                    if (n.startsWith('.')) { li.style.color = '#55ffff'; li.style.fontStyle = 'italic'; }
                    playersList.appendChild(li);
                });
                else playersList.innerHTML = '<li>No players online</li>';
            } else {
                status.textContent = 'Server is OFFLINE'; status.style.color = '#ff4444';
                playersList.innerHTML = '<li>No players online</li>';
            }
        })
        .catch(() => { document.getElementById('status').textContent = 'Status unavailable'; document.getElementById('status').style.color = '#ffaa00'; });
}
updateStatus();
setInterval(updateStatus, 30000);

function adjustPanorama() {
    if (!window.viewer) return;
    viewer.setHfov(window.innerWidth < 600 ? 180 : window.innerWidth < 900 ? 220 : 250);
}
window.addEventListener('resize', adjustPanorama);
window.addEventListener('orientationchange', adjustPanorama);
</script>
</body>
</html>
