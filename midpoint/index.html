<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MIDPOINTMC</title>
<link rel="icon" href="https://midpointmc.net/Midpoint.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Press Start 2P', cursive;
        color: #fff;
        overflow: hidden;
        position: relative;
        min-height: 100vh;
        text-align: center;
        background: #0a1f0a;
        image-rendering: pixelated;
    }
    #panorama {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -2; image-rendering: pixelated;
    }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 40%, transparent 20%, rgba(0,0,0,0.65) 100%);
        z-index: -1;
    }

    /* ── HEADER / LOGO ── */
    .header {
        position: absolute;
        top: -7%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: 80%;
        max-width: 750px;
    }
    .midpoint-title {
        width: 100%;
        height: auto;
        display: block;
        image-rendering: pixelated;
        filter: drop-shadow(0 0.4vw 0 #000) drop-shadow(0 -0.4vw 0 #000) drop-shadow(0.4vw 0 0 #000) drop-shadow(-0.4vw 0 0 #000);
    }

    /* ── SPLASH ── */
    .splash {
        position: fixed;
        transform: rotate(-12deg);
        transform-origin: top left;
        color: #ffff55;
        font-size: clamp(10px, 1.4vw, 18px);
        text-shadow: 2px 2px 0 #aa6600, 1px 1px 0 #000;
        pointer-events: none;
        white-space: nowrap;
        z-index: 9998;
    }

    /* ── MENU ── */
    .menu {
        position: absolute;
        top: 65%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 1.5vh;
    }
    .btn {
        display: block;
        width: clamp(200px, 35vw, 310px);
        height: clamp(32px, 4vw, 44px);
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.08s, filter 0.08s;
        padding: 0; border: none; background: none;
    }
    .btn img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
    .btn:active { transform: translateY(2px); filter: brightness(0.9); }
    .group { display: flex; gap: 0.6vw; justify-content: center; flex-wrap: wrap; }
    .group .btn {
        width: clamp(95px, 17vw, 150px);
        height: clamp(32px, 4vw, 44px);
    }

    /* ── STATUS BOX ── */
    #status-box {
        position: fixed; bottom: 1.5vh; left: 1.5vw;
        background: rgba(0,0,0,0.75);
        padding: clamp(8px, 1.5vh, 16px) clamp(10px, 1.8vw, 20px);
        border: clamp(2px, 0.3vw, 4px) solid #333;
        box-shadow: clamp(2px, 0.4vw, 5px) clamp(2px, 0.4vw, 5px) 0 #111;
        font-size: clamp(8px, 1.2vw, 14px);
        z-index: 20;
        min-width: clamp(140px, 20vw, 240px);
        max-width: clamp(160px, 25vw, 280px);
        text-align: left;
    }
    #status { color: #44ff44; font-weight: bold; display: block; margin-bottom: clamp(4px, 0.8vh, 10px); }
    #players { margin: 0; padding: 0; list-style: none; font-size: clamp(7px, 1vw, 12px); }
    #players li { margin: clamp(1px, 0.4vh, 4px) 0; word-break: break-all; }

    /* ── LOADING ── */
    #loading-screen {
        position: fixed; inset: 0; background: #0a1f0a; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #55ff55; font-family: 'Press Start 2P', cursive; font-size: clamp(14px, 4vw, 28px);
        text-shadow: 0.3vw 0.3vw 0 #000; transition: opacity 0.6s ease-out; pointer-events: all;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
        width: clamp(40px, 12vw, 60px);
        height: clamp(40px, 12vw, 60px);
        border: clamp(4px, 1.2vw, 6px) solid #55ff55;
        border-top-color: transparent;
        border-radius: 50%; animation: spin 1.2s linear infinite; margin-bottom: 2vh;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ── MOBILE (portrait phones, including high-res) ── */
    @media (max-width: 768px) and (orientation: portrait),
           (max-width: 600px) {
        .header {
            width: 92%;
            top: 1%;
        }
        .splash {
            font-size: clamp(7px, 2vw, 11px);
        }
        .menu {
            top: 55%;
            gap: 1.5vh;
        }
        .btn {
            width: 72vw;
            height: clamp(36px, 10vw, 50px);
        }
        .group {
            gap: 2.5vw;
        }
        .group .btn {
            width: 34vw;
            height: clamp(36px, 10vw, 50px);
        }
        #status-box {
            font-size: clamp(10px, 3vw, 14px);
            min-width: clamp(150px, 50vw, 230px);
            max-width: 64vw;
            padding: 2.5vw 3.5vw;
            border-width: 2px;
            bottom: 1vh;
            left: 1.5vw;
        }
        #players {
            font-size: clamp(9px, 2.6vw, 13px);
        }
    }

    /* ── MOBILE LANDSCAPE ── */
    @media (max-height: 500px) and (orientation: landscape) {
        .header { width: 50%; top: 1%; left: 25%; transform: none; }
        .menu { top: 55%; left: 55%; transform: translate(-50%, -50%); }
        .btn { width: 40vw; height: clamp(30px, 7vh, 44px); }
        .group .btn { width: 18vw; height: clamp(30px, 7vh, 44px); }
        #status-box { font-size: clamp(8px, 2vw, 12px); max-width: 40vw; }
    }

    /* ── TABLET ── */
    @media (min-width: 601px) and (max-width: 900px) {
        .header { width: 88%; top: 1%; }
        .splash { font-size: clamp(10px, 2vw, 16px); }
        .menu { top: 67%; gap: 1.8vh; }
        .btn {
            width: clamp(220px, 55vw, 300px);
            height: clamp(34px, 7vw, 46px);
        }
        .group .btn {
            width: clamp(100px, 26vw, 145px);
            height: clamp(34px, 7vw, 46px);
        }
        #status-box {
            font-size: clamp(8px, 1.6vw, 13px);
            min-width: clamp(140px, 28vw, 210px);
            max-width: clamp(160px, 33vw, 250px);
        }
        #players { font-size: clamp(7px, 1.4vw, 11px); }
    }
</style>
</head>
<body>
<div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">Loading world...</div>
</div>

<div id="panorama"></div>
<div class="vignette"></div>

<div class="header">
    <img src="minecraft_title.png?v=2" alt="MIDPOINT" class="midpoint-title">
</div>

<div class="splash" id="splash">More addictive than lemonade!</div>

<div class="menu">
    <a href="https://midpointmc.net/wiki/index.html" class="btn"><img src="wiki.png" alt="Wiki"></a>
    <a href="https://midpointmc.net/gallery/index.html" class="btn"><img src="Gallery.png" alt="Gallery"></a>
    <a href="https://midpointmc.net/Socials.html" class="btn"><img src="socials.png" alt="Socials"></a>
    <a href="https://midpointmc.net/info.html" class="btn"><img src="info.png" alt="Info"></a>
    <div class="group">
        <a href="https://map.midpointmc.net/" class="btn"><img src="map.png" alt="Map"></a>
        <a href="https://midpointmc.net/stats/" class="btn"><img src="stats.png" alt="Stats"></a>
    </div>
</div>

<div id="status-box">
    <span id="status">Checking server...</span>
    <ul id="players"></ul>
</div>

<script>
const loadingScreen = document.getElementById('loading-screen');
function hideLoading() {
    if (!loadingScreen) return;
    loadingScreen.classList.add('hidden');
    setTimeout(() => { if (loadingScreen.parentNode) loadingScreen.remove(); }, 700);
}

const hardTimeout = setTimeout(hideLoading, 4000);

try {
    window.viewer = pannellum.viewer('panorama', {
        type: "equirectangular",
        panorama: "output.jpg",
        autoLoad: true,
        autoRotate: -4.5,
        showControls: false,
        showFullscreenCtrl: false,
        showZoomCtrl: false,
        hfov: window.innerWidth < 600 ? 180 : window.innerWidth < 900 ? 220 : 250,
        pitch: -5,
        yaw: 35
    });
    window.viewer.on('load', () => { clearTimeout(hardTimeout); hideLoading(); });
    window.viewer.on('error', () => { clearTimeout(hardTimeout); hideLoading(); });
} catch(e) {
    clearTimeout(hardTimeout);
    document.body.style.background = "url('output.jpg') center/cover no-repeat";
    hideLoading();
}

// Splash
const splashes = ["More addictive than lemonade!", "MIDPOINTMC AWAITS!", "PUNCH A TREE TO START!", "NEVER DIG STRAIGHT DOWN!", "BUILD EPIC OR GO HOME"];
document.getElementById('splash').textContent = splashes[Math.floor(Math.random() * splashes.length)];

function positionSplash() {
    const title = document.querySelector('.midpoint-title');
    const splash = document.getElementById('splash');
    const rect = title.getBoundingClientRect();
    splash.style.left = '-9999px'; splash.style.top = '-9999px';
    const sw = splash.offsetWidth; const sh = splash.offsetHeight;
    const isMobile = window.innerWidth <= 768;
    const verticalOffset = isMobile ? 30 : 75;
    splash.style.left = (rect.right - sw + 5) + 'px';
    splash.style.top  = (rect.bottom - sh - verticalOffset) + 'px';
}
function waitAndPosition() { requestAnimationFrame(() => requestAnimationFrame(positionSplash)); }
const titleImg = document.querySelector('.midpoint-title');
if (titleImg.complete && titleImg.naturalWidth > 0) waitAndPosition();
else titleImg.addEventListener('load', waitAndPosition);
window.addEventListener('resize', positionSplash);

// Server status
function updateStatus() {
    fetch('https://api.mcsrvstat.us/3/midpointmc.net')
        .then(res => res.json())
        .then(data => {
            const status = document.getElementById('status');
            const playersList = document.getElementById('players');
            playersList.innerHTML = '';
            if (data.online) {
                status.textContent = 'Server is ONLINE!'; status.style.color = '#44ff44';
                let names = [];
                if (data.players && data.players.list) data.players.list.forEach(p => { names.push(typeof p==='object'?p.name:p); });
                names = [...new Set(names)];
                if (names.length > 0) names.forEach(n => {
                    const li = document.createElement('li'); li.textContent = n;
                    if (n.startsWith(".")) { li.style.color="#55ffff"; li.style.fontStyle="italic"; }
                    playersList.appendChild(li);
                });
                else playersList.innerHTML = '<li>No players online</li>';
            } else {
                status.textContent = 'Server is OFFLINE'; status.style.color = '#ff4444';
                playersList.innerHTML = '<li>No players online</li>';
            }
        })
        .catch(() => { document.getElementById('status').textContent='Status unavailable'; document.getElementById('status').style.color='#ffaa00'; });
}
updateStatus();
setInterval(updateStatus, 30000);

// Responsive panorama HFOV
function adjustPanorama() {
    if (!window.viewer) return;
    viewer.setHfov(window.innerWidth < 600 ? 180 : window.innerWidth < 900 ? 220 : 250);
}
window.addEventListener('resize', adjustPanorama);
window.addEventListener('orientationchange', adjustPanorama);
adjustPanorama();
</script>
</body>
</html>
