<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDPOINTMC</title>
    <link rel="icon" href="https://midpointmc.net/Midpoint.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            overflow: hidden;
            position: relative;
            min-height: 100vh;
            text-align: center;
            background: #0a1f0a;
            image-rendering: pixelated;
        }
        #panorama {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            image-rendering: pixelated;
        }
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 40%, transparent 20%, rgba(0,0,0,0.65) 100%);
            z-index: -1;
        }
        .header {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }
        .midpoint-title {
            width: 56.25vw;
            max-width: 625px;
            height: auto;
            image-rendering: pixelated;
            filter: drop-shadow(0 6px 0 #000) drop-shadow(0 -6px 0 #000) drop-shadow(6px 0 0 #000) drop-shadow(-6px 0 0 #000);
        }
        .splash {
            position: absolute;
            top: 32%;
            left: 68%;
            transform: translateX(-50%) rotate(-12deg);
            color: #ffff55;
            font-size: 0.9vw;
            min-font-size: 9px;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.7);
            pointer-events: none;
            white-space: nowrap;
            z-index: 11;
        }
        .menu {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            width: 310px;
            height: 40px;
            background: linear-gradient(to bottom, #a0a0a0 0%, #8b8b8b 45%, #737373 55%, #5a5a5a 100%);
            border: 2px solid #5a5a5a;
            border-bottom-color: #3a3a3a;
            border-right-color: #3a3a3a;
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.12),
                0 4px 0 #303030,
                inset 0 -3px 5px rgba(0,0,0,0.35);
            color: #ffffff;
            font-size: 1.2rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.08s;
            text-shadow: 1px 1px 2px #000;
            position: relative;
            image-rendering: pixelated;
            cursor: pointer;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #b8b8b8 0%, #a0a0a0 45%, #8b8b8b 55%, #737373 100%);
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.25),
                0 3px 0 #303030,
                inset 0 -3px 5px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.15),
                0 2px 0 #303030,
                inset 0 -3px 5px rgba(0,0,0,0.45);
        }
        .group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .group .btn {
            width: 150px;
            font-size: 1.1rem;
        }
        #status-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: auto;
            background: rgba(0,0,0,0.75);
            padding: 14px 18px;
            border: 5px solid #333;
            box-shadow: 6px 6px 0 #111;
            font-size: 1rem;
            z-index: 20;
            min-width: 220px;
            max-width: 280px;
            text-align: left;
            image-rendering: pixelated;
        }
        #status {
            color: #44ff44;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        #players {
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 0.9rem;
        }
        #players li {
            margin: 2px 0;
            word-break: break-all;
        }

        /* ─── LOADING SCREEN ──────────────────────────────────────── */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #0a1f0a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #55ff55;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.4rem;
            text-shadow: 3px 3px 0 #000;
            transition: opacity 0.6s ease-out;
            pointer-events: all;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #55ff55;
            border-top: 6px solid transparent;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Loading world...</div>
    </div>

    <div id="panorama"></div>
    <div class="vignette"></div>
    <div class="header">
        <img src="minecraft_title.png" alt="MIDPOINT" class="midpoint-title">
    </div>
    <div class="splash" id="splash">More addictive than lemonade!</div>
    <div class="menu">
        <a href="https://midpointmc.net/wiki/index.html" class="btn">Wiki</a>
        <a href="https://midpointmc.net/gallery/index.html" class="btn">Gallery</a>
        <a href="https://midpointmc.net/Socials.html" class="btn">Socials</a>
        <a href="https://midpointmc.net/info.html" class="btn">Info</a>
        <div class="group">
            <a href="https://map.midpointmc.net/" class="btn">Map</a>
            <a href="https://midpointmc.net/stats/" class="btn">Stats</a>
        </div>
    </div>

    <div id="status-box">
        <span id="status">Checking server...</span>
        <ul id="players"></ul>
    </div>

<script>
    // ─── LOADING CONTROL ────────────────────────────────────────
    const loadingScreen = document.getElementById('loading-screen');

    function hideLoading() {
        loadingScreen.classList.add('hidden');
        setTimeout(() => {
            loadingScreen.remove();
        }, 700);
    }

    // ─── PANORAMA WITH LOADING HANDLING ─────────────────────────
    let viewer;
    try {
        viewer = pannellum.viewer('panorama', {
            "type": "equirectangular",
            "panorama": "output.jpg",
            "autoLoad": true,
            "autoRotate": -4.5,
            "showControls": false,
            "showFullscreenCtrl": false,
            "showZoomCtrl": false,
            "hfov": 250,
            "pitch": -5,
            "yaw": 35
        });

        // Hide loading screen when panorama successfully loads
        viewer.on('load', function () {
            hideLoading();
        });

        // Fallback timeout (in case load event never fires)
        setTimeout(hideLoading, 12000);

    } catch (e) {
        console.error("Pannellum initialization failed:", e);
        document.body.style.background = "url('output.jpg') center/cover no-repeat";
        // Hide loading even on error (after short delay)
        setTimeout(hideLoading, 1500);
    }

    // ─── SPLASH ──────────────────────────────────────────────────
    const splashes = [
        "More addictive than lemonade!",
        "MIDPOINTMC AWAITS!",
        "PUNCH A TREE TO START!",
        "NEVER DIG STRAIGHT DOWN!",
        "BUILD EPIC OR GO HOME"
    ];
    document.getElementById('splash').textContent = splashes[Math.floor(Math.random() * splashes.length)];

    // ─── SERVER STATUS ───────────────────────────────────────────
    function updateStatus() {
        fetch('https://api.mcsrvstat.us/2/midpointmc.net')
            .then(res => res.json())
            .then(data => {
                const status = document.getElementById('status');
                const playersList = document.getElementById('players');
                playersList.innerHTML = '';

                if (data.online) {
                    status.textContent = 'Server is ONLINE!';
                    status.style.color = '#44ff44';

                    let playerNames = [];

                    // Java players
                    if (data.players && data.players.list) {
                        playerNames = playerNames.concat(data.players.list);
                    }

                    // Bedrock players (Geyser)
                    if (data.info && data.info.raw) {
                        playerNames = playerNames.concat(data.info.raw);
                    }

                    // remove duplicates
                    playerNames = [...new Set(playerNames)];

                    if (playerNames.length > 0) {
                        playerNames.forEach(name => {
                            const li = document.createElement('li');

                            if (name.startsWith(".")) {
                                li.textContent = name;
                                li.style.color = "#55ffff";
                                li.style.fontStyle = "italic";
                            } else {
                                li.textContent = name;
                            }

                            playersList.appendChild(li);
                        });
                    } else {
                        const li = document.createElement('li');
                        li.textContent = 'No players online';
                        playersList.appendChild(li);
                    }

                } else {
                    status.textContent = 'Server is OFFLINE';
                    status.style.color = '#ff4444';

                    const li = document.createElement('li');
                    li.textContent = 'No players online';
                    playersList.appendChild(li);
                }
            })
            .catch(() => {
                document.getElementById('status').textContent = 'Status unavailable';
                document.getElementById('status').style.color = '#ffaa00';
            });
    }
    updateStatus();
    setInterval(updateStatus, 30000);
</script>
</body>
</html>
